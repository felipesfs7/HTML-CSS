<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mais um desafio de tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        th, td {
            border: 2px solid black;
            padding: 10px;
        }
        table{
            border-collapse: collapse;
            width: 600px;
        }
        th{
            color: white;
            background-color: gray;
        }
        .materia{
            color:black;
            background-color: white;
        }
        .media{
            text-align: left;
        }



    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th scope="col" rowspan="2">Área</th>
                <th scope="col" rowspan="2">Disciplinas</th>
                <th scope="colgroup" colspan="2">notas</th>
                <th scope="col" rowspan="2">Média</th>
                <tr>
                    <th scope="col">Nota 1</th>
                    <th scope="col">Nota2</th>
                </tr>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th scope="rowgroup" class="materia" rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Fisíca</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>   
            </tr>
            <tr>
                <th scope="rowgroup" class="media" colspan="4">Média de exatas </th>
                <th>0.0</th>
            </tr>
            <tr>
                <th scope="row" class="materia" rowspan="2">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr><td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td></tr>
            <tr>
                <th scope="row" class="media" colspan="4">Média de Humanas </th>
                <th>0.0</th>
            </tr>
        </tbody>
    </table>
</body>
</html>
