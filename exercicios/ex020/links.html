<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a {color: red;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
            color: black;
        }

        a:visited { color: darkred;}
        a:active {
            color: yellow;
        }
        .especial::before {
            content: ' ⇒ ';

        }
        .especial::after {
            content: ' ⇐';
            text-decoration: none;
            font-weight: normal;
        }
        .especial {
            background-color: rgba(255, 0, 0, 0.316);
        }
    </style>
</head>
<body>
    <h1>personalizando links</h1>

    <UL>
        <li><a rel="external" target="_blank" href="https://gustavoguanabara.github.io">Repositório GitHub</a></li>
        <li><a rel="external" target="_blank" href="https://youtube.com/cursoemvideo/" class="especial">Canal do youtube</a></li>
        <li><a rel="external" target="_blank" href="https://www.cursoemvideo.com" class="especial">Site do Curso em video</a></li>
    </UL>
    

</body>
</html>
