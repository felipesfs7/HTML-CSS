<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        
        h1{ /* Box-level */
            height: 300px;
            width: 300px;
            background-color: lightgray;

/*
            border-width: 10px;
            border-style: solid;
            border-color: darkslategray;
*/
            border: 10px solid darkslategray;
/*
            padding-top: 10px;
            padding-left: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
*/
            padding: 10px 10px 10px 10px;

           margin: 20px auto 30px auto;
          
         
/*
            outline-width: 5px;
            outline-style: double;
            outline-color: red;
*/
            outline: 5px double red;
        }
        p{
            text-align: center;
        }
        a{ /* inline-level */
            border-width: 4px;
            border-style: solid;
            border-color: red;
           padding: 3px 3px 3px 3px;
        }
    </style>
</head>
<body>
    <h1>exemplo de Box-level</h1>
    <p>Páragrafos também são exemplos de box-level, mas  os <a href="#">Links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
