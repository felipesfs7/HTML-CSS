<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas e mais tabelas</title>
    <style>
        body{font-family: Arial, Helvetica, sans-serif;}
        caption{
            border: 2px solid black;
            border-bottom: 0px;
            padding: 10px;
            font-size: 1.5em;
            font-weight: bold;
        }
        table {
            width: 600px; 
            border-collapse: collapse;
        }
        table > tr > th {
            text-align: center;
            

        }
        th, td {
            border: 2px solid black;
            padding: 10px;
        }



    </style>
</head>

<body>
    
    <table>
        <caption>Filmes Favoritos</caption>

        <thead>
            <tr>
                <th scope="col">Grupo</th>
                <th scope="col">Nomes</th>
                <th scope="colgroup" colspan="3">Filmes</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="4">Mulheres</th>
                <tr>
                    <td>Ana Maria Santos</td>
                    <td>Alien</td>
                    <td>Rambo</td>  
                    <td>Vingadores</td>
                </tr>
                <tr>
                    <td>Beatriz Souza</td>
                    <td>Hulk</td>
                    <td>Inception</td>
                    <td>batman</td>
                </tr>
                <tr>
                    <td>Cláudia Melo</td>
                    <td>Oblivion</td>
                    <td>Matrix</td>
                    <td>Big Hero</td>
                </tr>
            </tr>   
            <tr>
                <th scope="rowgroup " rowspan="4">Homens</th>
                <tr>
                    <td>Bruno Mendonça</td>
                    <td>Intocáveis</td>
                    <td>Amnésia</td>
                    <td>Gladiador</td>
                </tr>
                <tr>
                    <td>Daniel Lourenço</td>
                    <td>Wall-E</td>
                    <td>Oldoby</td>
                    <td>Dangal</td>
                </tr>
                <tr>
                    <td>Fabiano Mota</td>
                    <td>Star Wars 5</td>
                    <td>Taxi Driver</td>
                    <td>Toy Story</td>
                </tr>
            </tr>
        </tbody>
    </table>

</body>
</html>
