<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
     form input{
        border-radius: 5px;
        box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.321);
        display: block;
        margin: auto;
        text-align: center;
        height: 30px;
       } 
     #enviar:hover {
        background-color: lightgreen;
        border: 2px solid black;
        transform: translate(0px, 10px);
        transition: 1s;
        box-shadow: 4px 4px 6px rgba(0, 0, 0, 0.195);
     }
     
    </style>
</head>
<body>
    <h1>Meu primeiro formulário</h1>
    <p>Coloque seu nome e sobrenome nas caixas a baixo:</p>
    <form>
        <p>Nome: <input type="text" name="nome" id="nome"></p>
        <p>Sobrenome: <input type="text" name="sobrenome" id="sobrenome"></p>
        <p><input id="enviar" type="submit" value="Enviar"></p>

    </form>
</body>
</html>
