<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flecxive box</title>
    <style>
        .container {
            background-color: lightsalmon;
            display: flex;
            height: 200px;
        }

        .item {
              background-color: lightskyblue;
              border:  1px solid black;
              flex: auto;
              text-align: center;
              flex-flow: row nowrap;
              padding:20px;
             
              
        }
        #i1 {
            order: 0;
            align-self: flex-end;
        }
        #i2 {
            order: -2;
            align-self: auto;
        }
        #i3 {
            order: 7;
        }
        #i4 {
            order: -1;
            align-self: flex-start;
        }
        #i5 {
            order: 5;
            align-self: stretch;
        }
        #i6 {
            order: 16;
        }
        #i7 {
            order: 2;
            align-self: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
