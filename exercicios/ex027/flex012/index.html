<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flecxive box</title>
    <style>
        .container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap
        }

        .item {
              background-color: lightskyblue;
              border:  1px solid black;
              text-align: center;
              flex-basis: 200px;
        }
        #i1 {
            flex: 1 0 200px;
        }
        #i2 {
            flex: 1 1 150px;
        }
        #i3 {
            flex: 1 3 auto;
        }

    </style>
</head>
<body>
    <div class="container">
        <div id="i1" class="item">A</div>
        <div id="i2" class="item">B</div>
        <div id="i3" class="item">C</div>
    </div>
</body>
</html>
